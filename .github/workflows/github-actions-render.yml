name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
    
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-slim

    steps:
      - name: Ping Render
        run: |
          curl -fsS --max-time 30 https://banksim-webswing-0-1.onrender.com/ > /dev/null \
            && echo "OK"
